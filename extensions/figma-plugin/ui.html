<!doctype html><html><head><meta charset="utf-8"><style>body{font:12px Inter,system-ui,sans-serif;margin:0;padding:16px;color:var(--figma-color-text)}h1{font-size:16px}p{line-height:1.45;color:var(--figma-color-text-secondary)}textarea{box-sizing:border-box;width:100%;height:300px;padding:8px;font:11px ui-monospace,monospace;background:var(--figma-color-bg-secondary);color:var(--figma-color-text);border:1px solid var(--figma-color-border);border-radius:6px}div{display:flex;gap:8px;margin-top:10px}button{flex:1;border:0;border-radius:6px;padding:9px;background:var(--figma-color-bg-brand);color:var(--figma-color-text-onbrand);font-weight:600}</style></head><body><h1>MyPath FigmaExchangeV1</h1><p>Export selected frames or paste a deterministic exchange from MyPath. No OAuth or network connection is used.</p><textarea id="exchange" placeholder="FigmaExchangeV1 JSON"></textarea><div><button id="export">Export selection</button><button id="import">Import JSON</button></div><p id="status" role="status"></p><script>const area=document.getElementById('exchange'),status=document.getElementById('status');document.getElementById('export').onclick=()=>parent.postMessage({pluginMessage:{type:'export'}},'*');document.getElementById('import').onclick=()=>{try{parent.postMessage({pluginMessage:{type:'import',exchange:JSON.parse(area.value)}},'*')}catch(error){status.textContent=error.message}};onmessage=({data})=>{const message=data.pluginMessage;if(message?.type==='exported'){area.value=JSON.stringify(message.exchange,null,2);status.textContent='Deterministic exchange ready.'}if(message?.type==='error')status.textContent=message.message};</script></body></html>
